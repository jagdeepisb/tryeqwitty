name: Open standard validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: python -m pip install -r report-kit/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          EQWITTY_REQUIRE_PDF_CHECKS: '1'
      - run: python analysis-kit/validate.py benchmarks/reported-saas.json
      - run: python analysis-kit/validate.py benchmarks/sparse-manufacturing.json
      - run: python analysis-kit/validate.py benchmarks/conflicting-revenue.json
      - run: python analysis-kit/to_report.py benchmarks/reported-saas.json /tmp/report.json
      - run: python report-kit/render.py /tmp/report.json --out /tmp/eqwitty-report --html-only --bundle benchmarks/reported-saas.json
      - run: python analysis-kit/benchmark.py > /tmp/benchmark-results.json && cmp benchmarks/v1.5/results.json /tmp/benchmark-results.json
