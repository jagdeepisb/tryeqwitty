name: Open standard validation
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF system dependencies from signed Ubuntu sources
        run: |
          # The hosted runner includes unrelated vendor repositories. A failure
          # at one of those must not prevent installing Ubuntu PDF libraries.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${apt_sources[@]}" update -qq
          sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends poppler-utils libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: python -m pip install -r report-kit/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          EQWITTY_REQUIRE_PDF_CHECKS: '1'
      - run: python analysis-kit/validate.py benchmarks/reported-saas.json
      - run: python analysis-kit/validate.py benchmarks/sparse-manufacturing.json
      - run: python analysis-kit/validate.py benchmarks/conflicting-revenue.json
      - run: python analysis-kit/to_report.py benchmarks/reported-saas.json /tmp/report.json
      - run: python report-kit/render.py /tmp/report.json --out /tmp/eqwitty-report --html-only --bundle benchmarks/reported-saas.json
      - run: python analysis-kit/benchmark.py > /tmp/benchmark-results.json && cmp benchmarks/v1.5/results.json /tmp/benchmark-results.json
      - name: Build and verify v2.0 release evidence
        run: |
          python release/certify.py build --out "$RUNNER_TEMP/eqwitty-release"
          python release/certify.py verify --out "$RUNNER_TEMP/eqwitty-release"
      - uses: actions/upload-artifact@v4
        with:
          name: eqwitty-v2.0.0-release-evidence
          path: ${{ runner.temp }}/eqwitty-release
          if-no-files-found: error
