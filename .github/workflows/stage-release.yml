name: Stage the v2.2.2 release
on:
  push:
    branches: [main]
    paths: [release/v2.2.2/RELEASE-NOTES.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eqwitty-v2.2.2-release
  cancel-in-progress: false
jobs:
  accept:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  draft:
    needs: accept
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: eqwitty-v2.2.2-release-evidence
          path: ${{ runner.temp }}/eqwitty-release
      - name: Stage the verified assets for publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s NOTICE.md
          tag=v2.2.2
          assets="$RUNNER_TEMP/eqwitty-release"
          (cd "$assets" && sha256sum --check SHA256SUMS.txt)
          jq --exit-status --arg commit "$GITHUB_SHA" \
            '.source_commit == $commit and .release == "2.2.2"' "$assets/release-manifest.json" >/dev/null
          if ! current=$(gh release view "$tag" --json targetCommitish,isDraft,assets 2>"$RUNNER_TEMP/release-view-error"); then
            cat "$RUNNER_TEMP/release-view-error"
            grep -qiE 'release not found|HTTP 404' "$RUNNER_TEMP/release-view-error"
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Eqwitty Open Diligence Standard $tag" \
              --notes-file release/v2.2.2/RELEASE-NOTES.md
            current=$(gh release view "$tag" --json targetCommitish,isDraft,assets)
          fi
          if jq --exit-status '.isDraft == false' <<< "$current" >/dev/null; then
            echo "Release $tag is already published; leaving it unchanged."
            exit 0
          fi
          prior=$(jq -r '.targetCommitish' <<< "$current")
          if [[ "$prior" != "$GITHUB_SHA" ]]; then
            echo "Draft target differs from this source. Follow release/RECOVERY.md; review and replace the entire unpublished draft explicitly."
            exit 1
          fi
          jq --exit-status --arg commit "$GITHUB_SHA" '.targetCommitish == $commit' <<< "$current" >/dev/null
          jq --exit-status --arg zip "eqwitty-$tag-reference.zip" \
            'all(.assets[]; .name == $zip or .name == "release-manifest.json" or .name == "SHA256SUMS.txt")' \
            <<< "$current" >/dev/null
          missing=()
          downloaded="$RUNNER_TEMP/eqwitty-check"
          mkdir -p "$downloaded"
          for name in "eqwitty-$tag-reference.zip" release-manifest.json SHA256SUMS.txt; do
            if jq --exit-status --arg name "$name" 'any(.assets[]; .name == $name)' <<< "$current" >/dev/null; then
              gh release download "$tag" --pattern "$name" --dir "$downloaded"
            else
              missing+=("$assets/$name")
            fi
          done
          if (( ${#missing[@]} )); then
            jq --exit-status '.isDraft' <<< "$current" >/dev/null
            # Never combine PDF assets regenerated by different builds.
            python release/staging.py "$downloaded" "$assets"
            gh release upload "$tag" "${missing[@]}"
            for file in "${missing[@]}"; do
              gh release download "$tag" --pattern "${file##*/}" --dir "$downloaded"
            done
          fi
          (cd "$downloaded" && sha256sum --check SHA256SUMS.txt)
          # WeasyPrint generates fresh structure identifiers in tagged PDFs.
          stable_manifest='del(.build_environment) | .files |= with_entries(select(.key | endswith(".pdf") | not))'
          diff -u <(jq -S "$stable_manifest" "$assets/release-manifest.json") \
            <(jq -S "$stable_manifest" "$downloaded/release-manifest.json")
          gh release view "$tag" --json url,isDraft,targetCommitish,assets \
            --jq '{url,isDraft,targetCommitish,assets:[.assets[].name]}'
