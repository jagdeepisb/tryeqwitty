<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 342" role="img" aria-labelledby="title desc"><title id="title">Conceptual evaluation workflow</title><desc id="desc">Five introductory stages. See canonical protocol for execution gates.</desc><rect width="900" height="342" fill="#FFFFFF"/><g font-family="Space Grotesk, Arial, sans-serif" fill="#111111"><text x="36" y="35" font-size="12" letter-spacing="2" fill="#646464">WORKFLOW / CONCEPTUAL OVERVIEW</text><path d="M36 56H864" stroke="#DCDCDC"/><text x="36" y="88" font-size="14" font-weight="700" letter-spacing="1.2">01 / UNDERSTAND</text><text x="300" y="88" font-size="19" font-family="DM Sans, Arial, sans-serif" fill="#646464">Company profile and independent thesis</text><path d="M36 108H864" stroke="#DCDCDC"/><text x="36" y="140" font-size="14" font-weight="700" letter-spacing="1.2">02 / INVESTIGATE</text><text x="300" y="140" font-size="19" font-family="DM Sans, Arial, sans-serif" fill="#646464">Material factors and external evidence</text><path d="M36 160H864" stroke="#DCDCDC"/><text x="36" y="192" font-size="14" font-weight="700" letter-spacing="1.2">03 / RECONCILE</text><text x="300" y="192" font-size="19" font-family="DM Sans, Arial, sans-serif" fill="#646464">Financial data, claims and assumptions</text><path d="M36 212H864" stroke="#DCDCDC"/><text x="36" y="244" font-size="14" font-weight="700" letter-spacing="1.2">04 / CHALLENGE</text><text x="300" y="244" font-size="19" font-family="DM Sans, Arial, sans-serif" fill="#646464">Contradictions, risks and valuation</text><path d="M36 264H864" stroke="#DCDCDC"/><text x="36" y="296" font-size="14" font-weight="700" letter-spacing="1.2">05 / VALIDATE</text><text x="300" y="296" font-size="19" font-family="DM Sans, Arial, sans-serif" fill="#646464">Traceable findings and reproducible outputs</text><path d="M36 316H864" stroke="#DCDCDC"/></g></svg>
